<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Room Planner 3D - AI Gemini</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action: manipulation; }
body { font-family:'Segoe UI',sans-serif; background:#2c2c2c; color:#eee; overflow:hidden; }
#app { display:flex; height:100vh; flex-direction:row; }

@media (max-width: 768px) {
  #app { flex-direction: column-reverse; overflow-y: auto; }
  #sidebar { width:100% !important; height:50vh; flex-shrink: 0; }
  #canvas-wrap { width:100%; height:50vh !important; flex-shrink: 0; }
}

#sidebar { width:280px; background:#1a1a1a; border-right:2px solid #333; overflow-y:auto; padding:0 0 20px 0; display:flex; flex-direction:column; }
#sidebar::-webkit-scrollbar { width:4px; }
#sidebar::-webkit-scrollbar-thumb { background:#444; }
.logo { padding:14px 16px; font-size:15px; font-weight:700; background:linear-gradient(135deg,#4285f4,#34a853); text-align:center; }
.section-title { padding:8px 12px 4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:#4285f4; border-top:1px solid #333; margin-top:6px; }
.input-group { padding:3px 12px; }
.input-group label { font-size:10px; color:#999; display:block; margin-bottom:2px; }
.input-group input, .input-group select { width:100%; background:#2a2a2a; border:1px solid #444; color:#eee; padding:5px 8px; border-radius:5px; font-size:12px; }
.input-group input[type="range"] { padding:0; accent-color:#4285f4; }
.btn { display:block; width:calc(100% - 24px); margin:3px 12px; padding:7px; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:0.2s; }
.btn:hover { opacity:0.85; }
.btn-blue { background:#4285f4; color:#fff; }
.btn-green { background:#34a853; color:#fff; }
.btn-red { background:#ea4335; color:#fff; }
.btn-gray { background:#444; color:#ccc; }
.btn-orange { background:#fbbc04; color:#000; }
.btn-purple { background:#7b4fa6; color:#fff; }
.upload-box { display:block; margin:6px 12px; border:2px dashed #4285f4; border-radius:8px; padding:12px; text-align:center; cursor:pointer; font-size:11px; color:#999; transition:0.2s; }
.upload-box:hover { border-color:#34a853; }
.upload-box input { display:none; }
#ai-status { margin:4px 12px; padding:8px; background:#1e3a1e; border:1px solid #34a853; border-radius:6px; font-size:11px; color:#34a853; display:none; }
#ai-loading { margin:4px 12px; padding:8px; background:#1a1a2e; border:1px solid #4285f4; border-radius:6px; font-size:11px; color:#4285f4; display:none; text-align:center; }
#tab-bar { display:flex; flex-wrap:wrap; gap:4px; padding:5px 12px; }
.tab { padding:3px 8px; border-radius:12px; font-size:10px; cursor:pointer; background:#2a2a2a; border:1px solid #444; color:#999; }
.tab.active { background:#4285f4; border-color:#4285f4; color:#fff; }
#furniture-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:5px 12px; }
.furn-card { background:#2a2a2a; border:1px solid #444; border-radius:6px; padding:8px 5px; text-align:center; cursor:pointer; transition:0.2s; }
.furn-card:hover { border-color:#4285f4; }
.furn-icon { font-size:18px; }
.furn-name { color:#aaa; margin-top:2px; font-size:9px; }
#color-picker { display:flex; flex-wrap:wrap; gap:4px; padding:4px 0; }
.color-dot { width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.color-dot:hover, .color-dot.active { border-color:#fff; }
#texture-picker { display:flex; flex-wrap:wrap; gap:4px; padding:4px 0; }
.tex-btn { padding:2px 7px; font-size:9px; border-radius:4px; cursor:pointer; background:#2a2a2a; border:1px solid #444; color:#aaa; }
.tex-btn.active { background:#4285f4; color:#fff; }
#space-display { margin:5px 12px; padding:10px; background:#2a2a2a; border-radius:8px; border:1px solid #444; }
#space-percent { font-size:26px; font-weight:700; color:#4285f4; }
#space-bar-wrap { height:6px; background:#111; border-radius:3px; margin:5px 0; overflow:hidden; }
#space-bar { height:100%; width:100%; background:linear-gradient(90deg,#34a853,#52b788); border-radius:3px; transition:0.5s; }
#space-detail { font-size:10px; color:#888; }
#view-btns { display:flex; gap:4px; padding:5px 12px; }
.view-btn { flex:1; padding:5px; border-radius:5px; font-size:10px; cursor:pointer; background:#2a2a2a; border:1px solid #444; color:#999; }
.view-btn.active { background:#4285f4; border-color:#4285f4; color:#fff; }
#canvas-wrap { flex:1; position:relative; overflow:hidden; }
#room-photo { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.25; display:none; pointer-events:none; z-index:0; }
#three-canvas { display:block; width:100%; height:100%; position:relative; z-index:1; touch-action: none; }
#selected-label { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(66,133,244,0.9); padding:5px 14px; border-radius:16px; font-size:11px; display:none; color:#fff; z-index:10; }
#hint { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); padding:4px 12px; border-radius:16px; font-size:10px; color:#aaa; pointer-events:none; z-index:10; text-align:center; }
#photo-toggle { position:absolute; top:8px; right:8px; background:rgba(66,133,244,0.85); border:none; color:#fff; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:10px; display:none; z-index:10; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="logo">Room Planner 3D + Gemini AI</div>

    <div class="section-title">AI วิเคราะห์รูปห้อง (ฟรี)</div>
    <label class="upload-box" id="upload-label">
      <input type="file" id="upload-photo" accept="image/*">
      <div style="font-size:24px">📸</div>
      <div>คลิกอัปโหลดรูปห้อง</div>
      <div style="font-size:9px;margin-top:3px;color:#555">Gemini AI จะวิเคราะห์ห้องให้อัตโนมัติ</div>
    </label>
    <button id="btn-ai-analyze" class="btn btn-orange" style="display:none">Gemini AI วิเคราะห์รูปห้อง</button>
    <div id="ai-loading">กำลังวิเคราะห์รูปด้วย Gemini AI...</div>
    <div id="ai-status"></div>

    <div class="section-title">ขนาดห้อง</div>
    <div class="input-group"><label>กว้าง (ม.)</label><input type="number" id="room-width" value="5" min="2" max="20" step="0.5"></div>

    <div class="input-group"><label>สีผนัง</label>
      <select id="wall-color">
        <option value="0xf0ebe3">ครีมอุ่น</option>
        <option value="0xffffff">ขาว</option>
        <option value="0xe8f0fe">ฟ้าอ่อน</option>
        <option value="0xfce4ec">ชมพูอ่อน</option>
        <option value="0xe8f5e9">เขียวอ่อน</option>
        <option value="0x455a64">เทาเข้ม</option>
      </select>
    </div>
    <div class="input-group"><label>ผิวพื้น</label>
      <select id="floor-type">
        <option value="wood">ไม้ปาร์เก้</option>
        <option value="tile">กระเบื้อง</option>

        <option value="carpet">พรม</option>
        <option value="dark">ไม้สีเข้ม</option>
      </select>

    <button id="btn-build" class="btn btn-blue">สร้างห้อง</button>
    <button id="btn-auto" class="btn btn-purple">จัดอัตโนมัติ</button>

    <div class="section-title">ต่อเติมห้อง</div>
    <div class="input-group"><label>เพิ่ม</label>
      <select id="add-type">
        <option value="window">หน้าต่าง</option>
        <option value="door">ประตู</option>
        <option value="divider">ผนังกั้น</option>
      </select>
    </div>
    <div class="input-group"><label>ผนัง</label>
      <select id="wall-side">
        <option value="back">ผนังหลัง</option>
        <option value="left">ผนังซ้าย</option>
        <option value="right">ผนังขวา</option>
      </select>
    </div>
    <button id="btn-add-element" class="btn btn-blue">เพิ่มลงผนัง</button>

    <div class="section-title">เฟอร์นิเจอร์</div>
    <div id="tab-bar">
      <button class="tab active" data-cat="all">ทั้งหมด</button>
      <button class="tab" data-cat="sleep">นอน</button>
      <button class="tab" data-cat="sit">นั่ง</button>
      <button class="tab" data-cat="table">โต๊ะ</button>
      <button class="tab" data-cat="storage">เก็บของ</button>
    </div>
    <div id="furniture-grid"></div>

    <div class="section-title">ปรับแต่ง</div>
    <div class="input-group"><label>หมุน: <span id="rot-label">0</span>°</label><input type="range" id="rot-slider" min="0" max="360" value="0"></div>
    <div class="input-group"><label>ขนาด: <span id="scale-label">1.0</span>x</label><input type="range" id="scale-slider" min="0.5" max="2.5" step="0.1" value="1"></div>
    <div class="input-group"><label>สี</label><div id="color-picker"></div></div>
    <div class="input-group"><label>วัสดุ</label><div id="texture-picker"></div></div>
    <button id="btn-delete" class="btn btn-red">ลบชิ้นที่เลือก</button>
    <button id="btn-clone" class="btn btn-gray">คัดลอก</button>

    <div class="section-title">พื้นที่ว่าง</div>
    <div id="space-display">
      <div id="space-percent">100%</div>
      <div id="space-bar-wrap"><div id="space-bar"></div></div>
      <div id="space-detail">กรุณาสร้างห้องก่อน</div>
    </div>

    <div class="section-title">มุมมอง</div>
    <div id="view-btns">
      <button class="view-btn active" data-view="sims">Sims</button>
      <button class="view-btn" data-view="top">บน</button>
      <button class="view-btn" data-view="front">หน้า</button>
      <button class="view-btn" data-view="free">อิสระ</button>
    </div>
    <button id="btn-save" class="btn btn-green">บันทึก JSON</button>
    <button id="btn-clear" class="btn btn-gray">ล้างทั้งหมด</button>
  </div>

  <div id="canvas-wrap">
    <img id="room-photo" alt="room">
    <canvas id="three-canvas"></canvas>
    <div id="hint">แตะ/คลิก=เลือกเฟอร์ฯ | 1 นิ้วลาก=ย้าย | 2 นิ้วลาก/คลิกขวา=หมุนห้อง</div>
    <button id="photo-toggle">ซ่อน/แสดงรูป</button>
    <div id="selected-label">เลือก: <span id="sel-name">-</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var FLIST = [
  {id:'bed_s', name:'เตียงเดี่ยว', cat:'sleep', icon:'[เตียง]', w:1.0, d:2.0, h:0.5, color:0xD7CCC8, shape:'bed'},
  {id:'bed_d', name:'เตียงคู่', cat:'sleep', icon:'[เตียง]', w:1.6, d:2.0, h:0.5, color:0xBCAAA4, shape:'bed'},
  {id:'bed_k', name:'เตียงคิง', cat:'sleep', icon:'[คิง]', w:2.0, d:2.2, h:0.55, color:0xA1887F, shape:'bed'},
  {id:'sofa2', name:'โซฟา 2 ที่', cat:'sit', icon:'[โซฟา]', w:1.6, d:0.85, h:0.8, color:0x90A4AE, shape:'sofa'},
  {id:'sofa3', name:'โซฟา 3 ที่', cat:'sit', icon:'[โซฟา]', w:2.2, d:0.9, h:0.8, color:0x78909C, shape:'sofa'},
  {id:'chair', name:'เก้าอี้', cat:'sit', icon:'[เก้าอี้]', w:0.6, d:0.6, h:0.9, color:0x8D6E63, shape:'chair'},
  {id:'dining4', name:'โต๊ะกิน 4', cat:'table', icon:'[โต๊ะ]', w:1.2, d:0.8, h:0.75, color:0xA1887F, shape:'table'},
  {id:'desk', name:'โต๊ะทำงาน', cat:'table', icon:'[โต๊ะ]', w:1.4, d:0.7, h:0.76, color:0x90A4AE, shape:'table'},
  {id:'coffee', name:'โต๊ะกลาง', cat:'table', icon:'[กลาง]', w:1.1, d:0.6, h:0.42, color:0xBCAAA4, shape:'table'},
  {id:'wardrobe', name:'ตู้เสื้อผ้า', cat:'storage', icon:'[ตู้]', w:1.2, d:0.6, h:2.0, color:0xD7CCC8, shape:'wardrobe'},
  {id:'shelf', name:'ชั้นหนังสือ', cat:'storage', icon:'[ชั้น]', w:0.8, d:0.3, h:1.8, color:0xA1887F, shape:'shelf'},
  {id:'tv', name:'ทีวี', cat:'storage', icon:'[TV]', w:1.4, d:0.08, h:0.8, color:0x212121, shape:'tv'},
  {id:'plant', name:'ต้นไม้', cat:'storage', icon:'[ต้น]', w:0.4, d:0.4, h:1.3, color:0x388E3C, shape:'plant'},
  {id:'lamp', name:'โคมไฟ', cat:'storage', icon:'[ไฟ]', w:0.3, d:0.3, h:1.5, color:0xFDD835, shape:'lamp'},
  {id:'rug', name:'พรม', cat:'storage', icon:'[พรม]', w:2.0, d:1.4, h:0.02, color:0xEF9A9A, shape:'rug'},
];

var COLORS = [0xFFFFFF,0xF5F5F5,0x212121,0x5D4037,0x8D6E63,0xA1887F,0xD7CCC8,0xD32F2F,0xE91E63,0x9C27B0,0x3F51B5,0x2196F3,0x00BCD4,0x4CAF50,0x8BC34A,0xFFEB3B,0xFF9800,0xFF5722,0x607D8B,0x90A4AE];
var TEXTURES = [{name:'ไม้',r:0.75,m:0},{name:'ผ้า',r:0.95,m:0},{name:'หนัง',r:0.45,m:0},{name:'โลหะ',r:0.15,m:0.85},{name:'พลาสติก',r:0.35,m:0.05}];

var scene, camera, renderer, furGroup, roomGroup, extraGroup;
var selObj=null, isDrag=false, isRotCam=false;
var prevM={x:0,y:0}, dragOff=new THREE.Vector3();
var dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
var rc=new THREE.Raycaster(), m2d=new THREE.Vector2();
var cnt=0, zones=[];
var RW=5, RL=4, RH=2.8;
var currentPhotoBase64=null, currentMimeType='image/jpeg';

// Touch Handling Variables
var activePointers = [];
var initialPinchDist = 0;

function init(){
  var cv=document.getElementById('three-canvas');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x2c2c2c,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x2c2c2c);

  camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(9,9,9);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  var sun=new THREE.DirectionalLight(0xfff5e0,1.1);
  sun.position.set(8,12,8);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-15; sun.shadow.camera.right=15;
  sun.shadow.camera.top=15; sun.shadow.camera.bottom=-15;
  scene.add(sun);
  var fill=new THREE.DirectionalLight(0xd0e8ff,0.4);
  fill.position.set(-6,8,-6); scene.add(fill);
  var warm=new THREE.PointLight(0xffddaa,0.6,20);
  warm.position.set(0,3,0); scene.add(warm);

  furGroup=new THREE.Group(); scene.add(furGroup);
  roomGroup=new THREE.Group(); scene.add(roomGroup);
  extraGroup=new THREE.Group(); scene.add(extraGroup);

  resize();
  window.addEventListener('resize',resize);

  // ระบบการทำงาน Touch/Mouse Pointer Event
  cv.addEventListener('pointerdown', onPointerDown);
  cv.addEventListener('pointermove', onPointerMove);
  cv.addEventListener('pointerup', onPointerUp);
  cv.addEventListener('pointercancel', onPointerUp);

  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomCamera(e.deltaY * 0.02);
  },{passive:false});
  
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  setupUI(); buildGrid(); buildColors(); buildTextures(); loop();
}

function zoomCamera(delta) {
  var s=new THREE.Spherical().setFromVector3(camera.position);
  s.radius=Math.max(3,Math.min(28,s.radius + delta));
  camera.position.setFromSpherical(s);
  camera.lookAt(0,RH/4,0);
}

function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); }

function resize(){
  var w=document.getElementById('canvas-wrap');
  renderer.setSize(w.clientWidth,w.clientHeight);
  camera.aspect=w.clientWidth/w.clientHeight;
  camera.updateProjectionMatrix();
}

// ===== GEMINI AI =====
async function analyzeWithGemini(){
  if(!currentPhotoBase64){alert('กรุณาอัปโหลดรูปห้องก่อนค่ะ');return;}

  document.getElementById('ai-loading').style.display='block';
  document.getElementById('ai-status').style.display='none';
  document.getElementById('btn-ai-analyze').disabled=true;

  try {
    var prompt = 'วิเคราะห์รูปห้องนี้และตอบเป็น JSON เท่านั้น ห้ามมีข้อความอื่น:\n{"width":5,"length":4,"height":2.8,"wallColor":"0xf0ebe3","floorType":"wood","furniture":[{"type":"bed_s","x":0,"z":0}]}\n\nกฎ: width/length/height เป็นเมตร (ประมาณจากรูป), wallColor เลือกจาก 0xf0ebe3/0xffffff/0xe8f0fe/0x455a64, floorType เลือกจาก wood/tile/marble/carpet/dark, furniture type เลือกจาก bed_s/bed_d/bed_k/sofa2/sofa3/chair/dining4/desk/coffee/wardrobe/shelf/tv/plant/lamp/rug, x และ z เป็นตำแหน่ง (-2 ถึง 2)';

    var response = await fetch('/api/analyze-room', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        prompt: prompt,
        imageBase64: currentPhotoBase64,
        mimeType: currentMimeType
      })
    });

    var data = await response.json();

    if(data.error){throw new Error(data.error.message);}

    var text = data.candidates[0].content.parts[0].text.trim();
    text = text.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();

    var result = JSON.parse(text);

    document.getElementById('room-width').value = result.width || 5;
    document.getElementById('room-length').value = result.length || 4;
    document.getElementById('room-height').value = result.height || 2.8;

    var wallSel=document.getElementById('wall-color');
    for(var i=0;i<wallSel.options.length;i++){
      if(wallSel.options[i].value===result.wallColor){wallSel.selectedIndex=i;break;}
    }

    var floorSel=document.getElementById('floor-type');
    for(var j=0;j<floorSel.options.length;j++){
      if(floorSel.options[j].value===result.floorType){floorSel.selectedIndex=j;break;}
    }

    buildRoom();

    while(furGroup.children.length)furGroup.remove(furGroup.children[0]);

    if(result.furniture && result.furniture.length>0){
      result.furniture.forEach(function(f){
        var found=FLIST.find(function(fl){return fl.id===f.type;});
        if(found){
          var g=new THREE.Group();
          var mat=new THREE.MeshStandardMaterial({color:found.color,roughness:0.65,metalness:0.05});
          buildShape(g,found,mat);
          g.position.set(f.x||0,found.h/2,f.z||0);
          g.name=found.id;
          g.userData=JSON.parse(JSON.stringify(found));
          g.userData.rotDeg=0; g.userData.scaleFactor=1; g.userData.objId=cnt++;
          furGroup.add(g);
        }
      });
    }

    updateSpace();

    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-status').style.display='block';
    document.getElementById('ai-status').textContent='Gemini วิเคราะห์เสร็จ! พบเฟอร์นิเจอร์ '+(result.furniture?result.furniture.length:0)+' ชิ้น';

  } catch(err){
    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-status').style.display='block';
    document.getElementById('ai-status').style.color='#ea4335';
    document.getElementById('ai-status').style.borderColor='#ea4335';
    document.getElementById('ai-status').style.background='#2a1010';
    document.getElementById('ai-status').textContent='Error: '+err.message;
    console.error(err);
  }

  document.getElementById('btn-ai-analyze').disabled=false;
}

// ===== ROOM =====
function buildRoom(){
  while(roomGroup.children.length)roomGroup.remove(roomGroup.children[0]);
  while(extraGroup.children.length)extraGroup.remove(extraGroup.children[0]);
  zones=[];

  RW=parseFloat(document.getElementById('room-width').value)||5;
  RL=parseFloat(document.getElementById('room-length').value)||4;
  RH=parseFloat(document.getElementById('room-height').value)||2.8;
  var wc=parseInt(document.getElementById('wall-color').value,16);
  var ft=document.getElementById('floor-type').value;

  var fc={wood:0xC19A6B,tile:0xF5F5F5,marble:0xEEEEEE,carpet:0x9E9E9E,dark:0x5D4037};
  var fr={wood:0.8,tile:0.1,marble:0.05,carpet:1.0,dark:0.75};
  var floor=new THREE.Mesh(new THREE.BoxGeometry(RW,0.08,RL),new THREE.MeshStandardMaterial({color:fc[ft]||0xC19A6B,roughness:fr[ft]||0.8}));
  floor.position.set(0,-0.04,0); floor.receiveShadow=true; roomGroup.add(floor);

  if(ft==='wood'||ft==='dark'){
    var lineMat=new THREE.MeshStandardMaterial({color:ft==='wood'?0xA0785A:0x4A3728,roughness:0.9});
    for(var xi=-Math.floor(RW/0.2);xi<=Math.floor(RW/0.2);xi++){
      var lx=xi*0.2;
      if(Math.abs(lx)<=RW/2){
        var line=new THREE.Mesh(new THREE.BoxGeometry(0.01,0.001,RL),lineMat);
        line.position.set(lx,0.04,0); roomGroup.add(line);
      }
    }
  }

  var t=0.14;
  var wm=new THREE.MeshStandardMaterial({color:wc,roughness:0.7});
  var trimMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3});

  addW(roomGroup,RW,RH,t,0,RH/2,-RL/2,wm);
  addW(roomGroup,t,RH,RL,-RW/2,RH/2,0,wm);

  var dw=0.9,dh=2.1,sw2=(RL-dw)/2;
  addW(roomGroup,t,RH-dh,RL,RW/2,dh+(RH-dh)/2,0,wm);
  addW(roomGroup,t,dh,sw2,RW/2,dh/2,-RL/2+sw2/2,wm);
  addW(roomGroup,t,dh,sw2,RW/2,dh/2,RL/2-sw2/2,wm);
  addW(roomGroup,t+0.03,dh+0.04,dw+0.06,RW/2,dh/2,0,new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.6}));
  zones.push({x:RW/2-0.3,z:0,w:0.5,d:dw+0.5});

  var ww2=1.2,wh2=0.9,wy2=RH*0.55,hw2=(RW-ww2)/2;
  addW(roomGroup,hw2,RH,t,-ww2/2-hw2/2,RH/2,-RL/2,wm);
  addW(roomGroup,hw2,RH,t,ww2/2+hw2/2,RH/2,-RL/2,wm);
  addW(roomGroup,ww2,wy2-wh2/2,t,0,(wy2-wh2/2)/2,-RL/2,wm);
  addW(roomGroup,ww2,RH-(wy2+wh2/2),t,0,wy2+wh2/2+(RH-(wy2+wh2/2))/2,-RL/2,wm);
  addW(roomGroup,ww2+0.1,wh2+0.1,t+0.02,0,wy2,-RL/2,trimMat);
  addW(roomGroup,ww2,wh2,t+0.04,0,wy2,-RL/2,new THREE.MeshStandardMaterial({color:0xaaddff,transparent:true,opacity:0.4}));
  addW(roomGroup,ww2,0.03,t+0.05,0,wy2,-RL/2,trimMat);
  addW(roomGroup,0.03,wh2,t+0.05,0,wy2,-RL/2,trimMat);
  zones.push({x:0,z:-RL/2+0.3,w:ww2+0.5,d:0.5});

  var edgeMat=new THREE.MeshStandardMaterial({color:wc,roughness:0.6});
  addW(roomGroup,RW,0.08,0.08,0,0.04,RL/2,edgeMat);
  addW(roomGroup,0.08,RH,0.08,-RW/2,RH/2,RL/2,edgeMat);
  addW(roomGroup,0.08,RH,0.08,RW/2,RH/2,RL/2,edgeMat);
  addW(roomGroup,RW,0.08,0.06,0,0.04,-RL/2,trimMat);
  addW(roomGroup,0.06,0.08,RL,-RW/2,0.04,0,trimMat);

  updateSpace();
}

  m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true;
  group.add(m); return m;

function addFurniture(data){
  var g=new THREE.Group();
  var mat=new THREE.MeshStandardMaterial({color:data.color,roughness:0.65,metalness:0.05});
  buildShape(g,data,mat);
  g.position.set(0,data.h/2,0);

  g.userData=JSON.parse(JSON.stringify(data));
  g.userData.rotDeg=0; g.userData.scaleFactor=1; g.userData.objId=cnt++;

function buildShape(g,data,mat){
  var w=data.w,d=data.d,h=data.h,shape=data.shape;
  if(shape==='bed'){
    addM(g,new THREE.BoxGeometry(w,h*0.5,d),new THREE.MeshStandardMaterial({color:0x8D6E63,roughness:0.6}),0,0,0);
    addM(g,new THREE.BoxGeometry(w-0.06,h*0.28,d-0.1),new THREE.MeshStandardMaterial({color:0xF5F5F5,roughness:0.9}),0,h*0.39,0);
    addM(g,new THREE.BoxGeometry(w-0.06,h*0.08,d*0.55),new THREE.MeshStandardMaterial({color:mat.color,roughness:0.9}),0,h*0.53,d*0.15);
    addM(g,new THREE.BoxGeometry(w,h*1.1,0.12),new THREE.MeshStandardMaterial({color:0x6D4C41,roughness:0.55}),0,h*0.28,-d/2+0.06);
    var pm=new THREE.MeshStandardMaterial({color:0xFAFAFA,roughness:0.95});
    if(w>1.3){addM(g,new THREE.BoxGeometry(w*0.36,0.1,0.3),pm,w*0.16,h*0.57,-d/2+0.24);addM(g,new THREE.BoxGeometry(w*0.36,0.1,0.3),pm,-w*0.16,h*0.57,-d/2+0.24);}
    else{addM(g,new THREE.BoxGeometry(w*0.6,0.1,0.3),pm,0,h*0.57,-d/2+0.24);}
    addLegs(g,w,d,-h/2,0.07,0.07,h*0.28,0x5D4037);
  } else if(shape==='sofa'){
    addM(g,new THREE.BoxGeometry(w,h*0.32,d),mat,0,-h*0.34,0);
    addM(g,new THREE.BoxGeometry(w-0.08,h*0.18,d*0.58),new THREE.MeshStandardMaterial({color:mat.color,roughness:0.9}),0,-h*0.1,0.04);
    addM(g,new THREE.BoxGeometry(w,h*0.52,d*0.22),mat,0,h*0.04,-d/2+d*0.11);
    var am=new THREE.Mesh(new THREE.BoxGeometry(d*0.2,h*0.38,d),mat);
    am.position.set(w/2-d*0.1,-h*0.12,0); am.castShadow=true; g.add(am);
    var am2=am.clone(); am2.position.x=-am.position.x; g.add(am2);
    addLegs(g,w,d,-h/2,0.07,0.07,h*0.16,0x4E342E);
  } else if(shape==='chair'){
    addM(g,new THREE.BoxGeometry(w,0.08,d),mat,0,0,0);
    addM(g,new THREE.BoxGeometry(w,h*0.5,0.07),mat,0,h*0.25,-d/2+0.035);
    addLegs(g,w,d,-h/2+0.02,0.045,0.045,h/2-0.02,0x5D4037);
  } else if(shape==='table'){
    addM(g,new THREE.BoxGeometry(w,0.06,d),mat,0,0,0);
    addLegs(g,w,d,-h/2,0.05,0.05,h/2,0x8D6E63);
  } else if(shape==='wardrobe'){
    addM(g,new THREE.BoxGeometry(w,h,d),mat,0,0,0);
    addM(g,new THREE.BoxGeometry(0.01,h*0.98,0.01),new THREE.MeshStandardMaterial({color:0x424242}),0,0,d/2);
    addM(g,new THREE.BoxGeometry(0.04,0.15,0.04),new THREE.MeshStandardMaterial({color:0xC0C0C0,metalness:0.8,roughness:0.2}),w*0.22,0.05,d/2+0.025);
    addM(g,new THREE.BoxGeometry(0.04,0.15,0.04),new THREE.MeshStandardMaterial({color:0xC0C0C0,metalness:0.8,roughness:0.2}),-w*0.22,0.05,d/2+0.025);
  } else if(shape==='shelf'){
    addM(g,new THREE.BoxGeometry(w,h,d),mat,0,0,0);
    var cnt2=Math.floor(h/0.35);
    var sm=new THREE.MeshStandardMaterial({color:0xD7CCC8,roughness:0.5});
    for(var i=0;i<cnt2;i++){addM(g,new THREE.BoxGeometry(w-0.04,0.025,d-0.02),sm,0,-h/2+0.08+i*(h/cnt2),0);}
  } else if(shape==='tv'){
    addM(g,new THREE.BoxGeometry(w+0.04,h+0.04,d+0.01),new THREE.MeshStandardMaterial({color:0x212121,roughness:0.3}),0,0,0);
    addM(g,new THREE.BoxGeometry(w,h,d+0.02),new THREE.MeshStandardMaterial({color:0x1a237e,roughness:0.05,metalness:0.3}),0,0,0);
  } else if(shape==='plant'){
    addM(g,new THREE.BoxGeometry(w*0.8,h*0.32,w*0.8),new THREE.MeshStandardMaterial({color:0x8D6E63,roughness:0.9}),0,-h/2+h*0.16,0);
    addM(g,new THREE.BoxGeometry(0.05,h*0.5,0.05),new THREE.MeshStandardMaterial({color:0x5D4037}),0,-h*0.1,0);
    addM(g,new THREE.BoxGeometry(w*0.85,h*0.55,w*0.85),new THREE.MeshStandardMaterial({color:0x388E3C,roughness:0.95}),0,h/2-h*0.22,0);
  } else if(shape==='lamp'){
    addM(g,new THREE.BoxGeometry(w*2,0.05,w*2),new THREE.MeshStandardMaterial({color:0x9E9E9E,metalness:0.6}),0,-h/2+0.025,0);
    addM(g,new THREE.BoxGeometry(0.04,h*0.75,0.04),new THREE.MeshStandardMaterial({color:0x9E9E9E,metalness:0.7}),0,-h*0.1,0);
    addM(g,new THREE.BoxGeometry(w*2.5,h*0.3,w*2.5),new THREE.MeshStandardMaterial({color:0xFFFDE7,roughness:0.8,emissive:0xFFE082,emissiveIntensity:0.5}),0,h/2-h*0.18,0);
  } else if(shape==='rug'){
    addM(g,new THREE.BoxGeometry(w,h,d),mat,0,0,0);
  } else {
    addM(g,new THREE.BoxGeometry(w,h,d),mat,0,0,0);
  }
  g.traverse(function(m){if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
}

function addM(g,geo,mat,x,y,z){var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);}
function addLegs(g,w,d,by,lw,ld,lh,c){
  var lm=new THREE.MeshStandardMaterial({color:c,roughness:0.7});
  [[w/2-lw-0.02,d/2-ld-0.02],[-w/2+lw+0.02,d/2-ld-0.02],[w/2-lw-0.02,-d/2+ld+0.02],[-w/2+lw+0.02,-d/2+ld+0.02]].forEach(function(p){
    var l=new THREE.Mesh(new THREE.BoxGeometry(lw,lh,ld),lm);
    l.position.set(p[0],by+lh/2,p[1]); l.castShadow=true; g.add(l);
  });
}

// ===== SYSTEM TOUCH / POINTER EVENTS =====
function onPointerDown(e){
  activePointers.push(e);

  if (activePointers.length === 1) {
    if (e.button === 2) {
      isRotCam = true;
      prevM = { x: e.clientX, y: e.clientY };
      return;
    }

    updM(e);
    rc.setFromCamera(m2d, camera);
    var hits = rc.intersectObjects(furGroup.children, true);

    if (hits.length > 0) {
      var o = hits[0].object;
      while (o.parent && o.parent !== furGroup) o = o.parent;
      selectObj(o);
      isDrag = true;
      dragPlane.constant = -(o.position.y - o.userData.h / 2);
      var pt = new THREE.Vector3();
      rc.ray.intersectPlane(dragPlane, pt);
      dragOff.copy(o.position).sub(pt);
    } else {
      deselectObj();
      isRotCam = true;
      prevM = { x: e.clientX, y: e.clientY };
    }
  } else if (activePointers.length === 2) {
    isDrag = false;
    isRotCam = true;
    prevM = {
      x: (activePointers[0].clientX + activePointers[1].clientX) / 2,
      y: (activePointers[0].clientY + activePointers[1].clientY) / 2
    };
    initialPinchDist = Math.hypot(
      activePointers[0].clientX - activePointers[1].clientX,
      activePointers[0].clientY - activePointers[1].clientY
    );
  }
}

function onPointerMove(e){
  for (var i = 0; i < activePointers.length; i++) {
    if (activePointers[i].pointerId === e.pointerId) {
      activePointers[i] = e;
      break;
    }
  }

  if (activePointers.length === 2) {
    var curDist = Math.hypot(
      activePointers[0].clientX - activePointers[1].clientX,
      activePointers[0].clientY - activePointers[1].clientY
    );
    var diff = initialPinchDist - curDist;
    if (Math.abs(diff) > 5) {
      zoomCamera(diff * 0.02);
      initialPinchDist = curDist;
    }

    var midX = (activePointers[0].clientX + activePointers[1].clientX) / 2;
    var midY = (activePointers[0].clientY + activePointers[1].clientY) / 2;
    var dx = (midX - prevM.x) * 0.4;
    var dy = (midY - prevM.y) * 0.4;
    prevM = { x: midX, y: midY };

    var s = new THREE.Spherical().setFromVector3(camera.position);
    s.theta -= dx * Math.PI / 180;
    s.phi = Math.max(0.15, Math.min(Math.PI * 0.42, s.phi + dy * Math.PI / 180));
    camera.position.setFromSpherical(s);
    camera.lookAt(0, RH / 4, 0);
    return;
  }

  if (isRotCam && activePointers.length === 1) {
    var dx = (e.clientX - prevM.x) * 0.4;
    var dy = (e.clientY - prevM.y) * 0.4;
    prevM = { x: e.clientX, y: e.clientY };

    var s = new THREE.Spherical().setFromVector3(camera.position);
    s.theta -= dx * Math.PI / 180;
    s.phi = Math.max(0.15, Math.min(Math.PI * 0.42, s.phi + dy * Math.PI / 180));
    camera.position.setFromSpherical(s);
    camera.lookAt(0, RH / 4, 0);
    return;
  }

  if (isDrag && selObj && activePointers.length === 1) {
    updM(e);
    rc.setFromCamera(m2d, camera);
    var pt = new THREE.Vector3();
    rc.ray.intersectPlane(dragPlane, pt);
    var dd = selObj.userData;
    var mx = RW / 2 - (dd.w * selObj.scale.x) / 2 - 0.1;
    var mz = RL / 2 - (dd.d * selObj.scale.z) / 2 - 0.1;
    var cx = Math.max(-mx, Math.min(mx, pt.x + dragOff.x));
    var cz = Math.max(-mz, Math.min(mz, pt.z + dragOff.z));
    if (!blk(cx, cz, dd.w * selObj.scale.x, dd.d * selObj.scale.z)) {
      selObj.position.x = cx;
      selObj.position.z = cz;
    }
    updateSpace();
  }
}

function onPointerUp(e){
  activePointers = activePointers.filter(function(p){ return p.pointerId !== e.pointerId; });
  if (activePointers.length === 0) {
    isRotCam = false;
    isDrag = false;
  } else if (activePointers.length === 1) {
    prevM = { x: activePointers[0].clientX, y: activePointers[0].clientY };
  }
}

function updM(e){
  var r=renderer.domElement.getBoundingClientRect();
  m2d.x=((e.clientX-r.left)/r.width)*2-1;
  m2d.y=-((e.clientY-r.top)/r.height)*2+1;
}

function blk(x,z,fw,fd){
  for(var i=0;i<zones.length;i++){
    var b=zones[i];
    if(Math.abs(x-b.x)<(fw+b.w)/2+0.1 && Math.abs(z-b.z)<(fd+b.d)/2+0.1) return true;
  }
  return false;
}

function selectObj(o){
  if(selObj)hl(selObj,false); selObj=o; hl(o,true);
  document.getElementById('sel-name').textContent=o.userData.name||'-';
  document.getElementById('selected-label').style.display='block';
  document.getElementById('rot-slider').value=o.userData.rotDeg||0;
  document.getElementById('rot-label').textContent=Math.round(o.userData.rotDeg||0);
  document.getElementById('scale-slider').value=o.userData.scaleFactor||1;
  document.getElementById('scale-label').textContent=(o.userData.scaleFactor||1).toFixed(1);
}

function deselectObj(){if(selObj)hl(selObj,false);selObj=null;document.getElementById('selected-label').style.display='none';}
function hl(o,on){o.traverse(function(m){if(m.isMesh&&m.material&&m.material.emissive)m.material.emissive.setHex(on?0x334466:0);});}

function updateSpace(){
  var ta=RW*RL,ua=0;
  furGroup.children.forEach(function(o){var d=o.userData,s=o.scale.x;ua+=(d.w||0.8)*s*(d.d||0.8)*s;});
  var fp=Math.max(0,Math.round((1-ua/ta)*100));
  document.getElementById('space-percent').textContent=fp+'%';
  document.getElementById('space-bar').style.width=fp+'%';
  document.getElementById('space-detail').textContent='ห้อง '+ta.toFixed(1)+' ม² | ใช้ '+ua.toFixed(1)+' ม² | ว่าง '+(ta-ua).toFixed(1)+' ม²';
  var bar=document.getElementById('space-bar');
  if(fp>50)bar.style.background='linear-gradient(90deg,#34a853,#52b788)';
  else if(fp>25)bar.style.background='linear-gradient(90deg,#fbbc04,#e67e22)';
  else bar.style.background='linear-gradient(90deg,#ea4335,#c0392b)';
}

      var o=items[i],d=o.userData;
      var fw=(d.w||0.8)*o.scale.x,fd=(d.d||0.8)*o.scale.z;
      if(cx+fw>RW/2-0.2){cx=-RW/2+0.5;cz+=maxD+0.15;maxD=0;}
      var tx=Math.max(-RW/2+fw/2+0.1,Math.min(RW/2-fw/2-0.1,cx+fw/2));
      var tz=Math.max(-RL/2+fd/2+0.1,Math.min(RL/2-fd/2-0.1,cz+fd/2));
      if(!blk(tx,tz,fw,fd)){o.position.x=tx;o.position.z=tz;}
      cx+=fw+0.15;maxD=Math.max(maxD,fd);
    }
    updateSpace(); alert('จัดห้องอัตโนมัติเสร็จแล้ว!');
  };

  document.getElementById('btn-delete').onclick=function(){if(!selObj)return;furGroup.remove(selObj);deselectObj();updateSpace();};
  document.getElementById('btn-clone').onclick=function(){
    if(!selObj)return;
    var d=selObj.userData,g=new THREE.Group();
    var mat=new THREE.MeshStandardMaterial({color:d.color||0x8D6E63,roughness:0.65});
    buildShape(g,d,mat);
    g.position.set(selObj.position.x+0.5,selObj.position.y,selObj.position.z+0.5);
    g.rotation.y=selObj.rotation.y; g.scale.copy(selObj.scale);
    g.name=d.id; g.userData=JSON.parse(JSON.stringify(d)); g.userData.objId=cnt++;
    furGroup.add(g); selectObj(g); updateSpace();
  };
  document.getElementById('btn-clear').onclick=function(){while(furGroup.children.length)furGroup.remove(furGroup.children[0]);deselectObj();updateSpace();};
  document.getElementById('btn-save').onclick=function(){
    var layout={room:{w:RW,l:RL,h:RH},furniture:furGroup.children.map(function(o){return {id:o.name,name:o.userData.name,x:o.position.x.toFixed(2),z:o.position.z.toFixed(2),rot:o.rotation.y.toFixed(3),scale:o.scale.x.toFixed(2)};})};
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(layout,null,2)],{type:'application/json'}));
    a.download='room-layout.json'; a.click();
  };

  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');buildGrid(t.dataset.cat);};
  });
  document.querySelectorAll('.view-btn').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');
      var v=b.dataset.view;
      if(v==='sims'){camera.position.set(9,9,9);camera.lookAt(0,0,0);}
      else if(v==='top'){camera.position.set(0,15,0.001);camera.lookAt(0,0,0);}
      else if(v==='front'){camera.position.set(0,RH/2,12);camera.lookAt(0,RH/2,0);}
      else{camera.position.set(10,5,10);camera.lookAt(0,1,0);}
    };
  });
  document.getElementById('rot-slider').oninput=function(){
    document.getElementById('rot-label').textContent=Math.round(this.value);
    if(selObj){selObj.rotation.y=parseFloat(this.value)*Math.PI/180;selObj.userData.rotDeg=parseFloat(this.value);}
  };
  document.getElementById('scale-slider').oninput=function(){
    var v=parseFloat(this.value);
    document.getElementById('scale-label').textContent=v.toFixed(1);
    if(selObj){selObj.scale.setScalar(v);selObj.userData.scaleFactor=v;updateSpace();}
  };
}

function buildGrid(cat){
  var grid=document.getElementById('furniture-grid');grid.innerHTML='';
  var list=(!cat||cat==='all')?FLIST:FLIST.filter(function(f){return f.cat===cat;});
  list.forEach(function(f){
    var c=document.createElement('div');c.className='furn-card';
    c.innerHTML='<div class="furn-icon">'+f.icon+'</div><div class="furn-name">'+f.name+'</div>';
    c.onclick=function(){addFurniture(f);}; grid.appendChild(c);
  });
}

function buildColors(){
  var w=document.getElementById('color-picker');
  COLORS.forEach(function(h){
    var d=document.createElement('div');d.className='color-dot';
    d.style.background='#'+h.toString(16).padStart(6,'0');
    d.onclick=function(){
      document.querySelectorAll('.color-dot').forEach(function(x){x.classList.remove('active');});d.classList.add('active');
      if(selObj)selObj.traverse(function(m){if(m.isMesh&&!m.material.transparent)m.material=new THREE.MeshStandardMaterial({color:h,roughness:0.65});});
    };
    w.appendChild(d);
  });
}

function buildTextures(){
  var w=document.getElementById('texture-picker');
  TEXTURES.forEach(function(t){
    var b=document.createElement('div');b.className='tex-btn';b.textContent=t.name;
    b.onclick=function(){
      document.querySelectorAll('.tex-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');
      if(selObj)selObj.traverse(function(m){if(m.isMesh){m.material.roughness=t.r;m.material.metalness=t.m;m.material.needsUpdate=true;}});
    };
    w.appendChild(b);
  });
}

init();
buildRoom();
</script>
</body>
</html>
