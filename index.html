function init(){
  var cv=document.getElementById('three-canvas');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x2c2c2c,1);

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x2c2c2c);

  camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(9,9,9);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  var sun=new THREE.DirectionalLight(0xfff5e0,1.2);
  sun.position.set(8,12,8);
  sun.castShadow=true;
  scene.add(sun);

  furGroup=new THREE.Group(); scene.add(furGroup);
  roomGroup=new THREE.Group(); scene.add(roomGroup);
  extraGroup=new THREE.Group(); scene.add(extraGroup);

  resize();
  window.addEventListener('resize',resize);

  cv.addEventListener('pointerdown', onPointerDown);
  cv.addEventListener('pointermove', onPointerMove);
  cv.addEventListener('pointerup', onPointerUp);
  cv.addEventListener('pointercancel', onPointerUp);

  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomCamera(e.deltaY * 0.02);
  },{passive:false});

  setupUI(); buildGrid(); buildColors(); buildTextures(); loop();
}

function zoomCamera(delta) {
  var s=new THREE.Spherical().setFromVector3(camera.position);
  s.radius=Math.max(3,Math.min(28,s.radius + delta));
  camera.position.setFromSpherical(s);
  camera.lookAt(0,RH/4,0);
}

function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); }

function resize(){
  var w=document.getElementById('canvas-wrap');
  renderer.setSize(w.clientWidth,w.clientHeight);
  camera.aspect=w.clientWidth/w.clientHeight;
  camera.updateProjectionMatrix();
}

// ===== GEMINI AI =====
async function analyzeWithGemini(){
  if(!currentPhotoBase64){alert('กรุณาอัปโหลดรูปห้องก่อนค่ะ');return;}

  document.getElementById('ai-loading').style.display='block';
  document.getElementById('ai-status').style.display='none';
  document.getElementById('btn-ai-analyze').disabled=true;

  try {
    var prompt = 'วิเคราะห์รูปห้องนี้และตอบเป็น JSON เท่านั้น:\n{"width":3.5,"length":4,"height":2.7,"wallColor":"0xe8f0fe","floorType":"wood","furniture":[{"type":"bed_s","x":-1.0,"z":-1.0}]}\n\nกฎสำคัญ:\n1. width/length/height เป็นเมตร\n2. ห้ามวางเฟอร์นิเจอร์ขวางประตูทางเข้าฝั่งขวา';

    var response = await fetch('/api/analyze-room', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ prompt: prompt, imageBase64: currentPhotoBase64, mimeType: currentMimeType })
    });

    var data = await response.json();
    if(data.error){throw new Error(data.error.message);}

    var text = data.candidates[0].content.parts[0].text.trim();
    text = text.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    var result = JSON.parse(text);

    document.getElementById('room-width').value = result.width || 5;
    document.getElementById('room-length').value = result.length || 4;
    document.getElementById('room-height').value = result.height || 2.8;

    buildRoom();
    while(furGroup.children.length)furGroup.remove(furGroup.children[0]);

    if(result.furniture && result.furniture.length>0){
      result.furniture.forEach(function(f){
        var found=FLIST.find(function(fl){return fl.id===f.type;});
        if(found){ addFurnitureAt(found, f.x||0, f.z||0); }
      });
    }

    updateSpace();
    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-status').style.display='block';
    document.getElementById('ai-status').textContent='วิเคราะห์เสร็จสมบูรณ์!';
  } catch(err){
    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-status').style.display='block';
    document.getElementById('ai-status').style.color='#ea4335';
    document.getElementById('ai-status').textContent='Error: '+err.message;
  }
  document.getElementById('btn-ai-analyze').disabled=false;
}

// ===== ROOM BUILDER =====
function buildRoom(){
  while(roomGroup.children.length)roomGroup.remove(roomGroup.children[0]);
  while(extraGroup.children.length)extraGroup.remove(extraGroup.children[0]);
  zones=[];

  RW=parseFloat(document.getElementById('room-width').value)||5;
  RL=parseFloat(document.getElementById('room-length').value)||4;
  RH=parseFloat(document.getElementById('room-height').value)||2.8;
  var wc=parseInt(document.getElementById('wall-color').value,16);
  var ft=document.getElementById('floor-type').value;

  var fc={wood:0xC19A6B,tile:0xF5F5F5,marble:0xEEEEEE,carpet:0x9E9E9E,dark:0x5D4037};
  var floor=new THREE.Mesh(new THREE.BoxGeometry(RW,0.02,RL),new THREE.MeshStandardMaterial({color:fc[ft]||0xC19A6B,roughness:0.8}));
  floor.position.set(0,-0.01,0); floor.receiveShadow=true; roomGroup.add(floor);

  var t=0.14;
  var wm=new THREE.MeshStandardMaterial({color:wc,roughness:0.7});
  var trimMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3});

  var ww2=1.2,wh2=0.9,wy2=RH*0.55,hw2=(RW-ww2)/2;
  addW(roomGroup,hw2,RH,t,-ww2/2-hw2/2,RH/2,-RL/2,wm);
  addW(roomGroup,hw2,RH,t,ww2/2+hw2/2,RH/2,-RL/2,wm);
  addW(roomGroup,ww2,wy2-wh2/2,t,0,(wy2-wh2/2)/2,-RL/2,wm);
  addW(roomGroup,ww2,RH-(wy2+wh2/2),t,0,wy2+wh2/2+(RH-(wy2+wh2/2))/2,-RL/2,wm);
  addW(roomGroup,ww2+0.1,wh2+0.1,t+0.02,0,wy2,-RL/2,trimMat);
  addW(roomGroup,ww2,wh2,t+0.04,0,wy2,-RL/2,new THREE.MeshStandardMaterial({color:0xaaddff,transparent:true,opacity:0.4}));

  addW(roomGroup,t,RH,RL,-RW/2,RH/2,0,wm);

  var dw=0.9,dh=2.1,sw2=(RL-dw)/2;
  addW(roomGroup,t,RH-dh,RL,RW/2,dh+(RH-dh)/2,0,wm);
  addW(roomGroup,t,dh,sw2,RW/2,dh/2,-RL/2+sw2/2,wm);
  addW(roomGroup,t,dh,sw2,RW/2,dh/2,RL/2-sw2/2,wm);
  addW(roomGroup,t+0.03,dh+0.04,dw+0.06,RW/2,dh/2,0,new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.6}));
  zones.push({x:RW/2-0.5, z:0, w:1.0, d:dw+0.8});

  updateSpace();
}

function addW(group,w,h,d,px,py,pz,mat){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true;
  group.add(m); return m;
}

// ===== REALISTIC 3D MODEL GENERATOR =====
function addFurniture(data){ addFurnitureAt(data, 0, 0); }

function addFurnitureAt(data, x, z){
  var g=new THREE.Group();
  var mat=new THREE.MeshStandardMaterial({color:data.color,roughness:0.6,metalness:0.05});
  buildShape(g,data,mat);

  g.position.set(x, 0, z);
  g.name=data.id;
  g.userData=JSON.parse(JSON.stringify(data));
  g.userData.rotDeg=0; g.userData.scaleFactor=1; g.userData.objId=cnt++;

  furGroup.add(g);
  adjustStackHeight(g);
  selectObj(g);
  updateSpace();
}

function buildShape(g,data,mat){
  var w=data.w,d=data.d,h=data.h,shape=data.shape;

  if(shape==='bed'){
    addM(g,new THREE.BoxGeometry(w,h*0.3,d),new THREE.MeshStandardMaterial({color:0x5D4037,roughness:0.6}),0,h*0.15,0);
    addM(g,new THREE.BoxGeometry(w-0.08,h*0.35,d-0.1),new THREE.MeshStandardMaterial({color:0xFAFAFA,roughness:0.9}),0,h*0.425,0);
    addM(g,new THREE.BoxGeometry(w-0.06,h*0.12,d*0.55),mat,0,h*0.54,d*0.2);
    addM(g,new THREE.BoxGeometry(w,h*1.1,0.12),new THREE.MeshStandardMaterial({color:0x4E342E,roughness:0.55}),0,h*0.55,-d/2+0.06);
    var pm=new THREE.MeshStandardMaterial({color:0xE0E0E0,roughness:0.95});
    if(w>1.3){
      addM(g,new THREE.BoxGeometry(w*0.38,0.12,0.35),pm,w*0.22,h*0.64,-d/2+0.28);
      addM(g,new THREE.BoxGeometry(w*0.38,0.12,0.35),pm,-w*0.22,h*0.64,-d/2+0.28);
    } else {
      addM(g,new THREE.BoxGeometry(w*0.65,0.12,0.35),pm,0,h*0.64,-d/2+0.28);
    }
  } else if(shape==='sofa'){
    addM(g,new THREE.BoxGeometry(w,h*0.35,d*0.8),mat,0,h*0.25,d*0.05);
    addM(g,new THREE.BoxGeometry(w,h*0.7,d*0.25),mat,0,h*0.55,-d/2+d*0.125);
    var armL = new THREE.Mesh(new THREE.BoxGeometry(d*0.25,h*0.5,d),mat); armL.position.set(-w/2+d*0.125,h*0.35,0); g.add(armL);
    var armR = new THREE.Mesh(new THREE.BoxGeometry(d*0.25,h*0.5,d),mat); armR.position.set(w/2-d*0.125,h*0.35,0); g.add(armR);
  } else if(shape==='bar'){
    // ตัวเคาน์เตอร์บาร์หลัก
    addM(g, new THREE.BoxGeometry(w, h, d*0.7), mat, 0, h/2, -d*0.15);
    
    // ท็อปเคาน์เตอร์บาร์ด้านบน (ยื่นออกมาขอบหนา)
    var topMat = new THREE.MeshStandardMaterial({color: 0x212121, roughness: 0.3});
    addM(g, new THREE.BoxGeometry(w+0.1, 0.08, d+0.1), topMat, 0, h+0.04, 0);

    // เก้าอี้บาร์ทรงสูง (Bar Stool) 2 ตัวด้านหน้า
    var stoolMat = new THREE.MeshStandardMaterial({color: 0x8D6E63, roughness: 0.5});
    [-w*0.25, w*0.25].forEach(function(xPos){
      var seat = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 16), stoolMat);
      seat.position.set(xPos, h*0.65, d*0.45);
      seat.castShadow = true; g.add(seat);
      
      var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, h*0.65, 12), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8}));
      leg.position.set(xPos, h*0.325, d*0.45);
      leg.castShadow = true; g.add(leg);
    });
  } else if(shape==='toilet'){
    var base=new THREE.Mesh(new THREE.CylinderGeometry(w*0.38,w*0.32,h*0.5,16),mat); base.position.set(0,h*0.25,d*0.1); g.add(base);
    addM(g,new THREE.BoxGeometry(w*0.8,0.05,d*0.5),mat,0,h*0.525,d*0.1);
    addM(g,new THREE.BoxGeometry(w*0.85,h*0.5,d*0.35),mat,0,h*0.65,-d*0.28);
    addM(g,new THREE.BoxGeometry(0.12,0.04,0.08),new THREE.MeshStandardMaterial({color:0xCFD8DC,metalness:0.8}),0,h*0.92,-d*0.28);
  } else if(shape==='basin'){
    var bowl=new THREE.Mesh(new THREE.CylinderGeometry(w*0.4,w*0.28,h*0.3,16,1,true),new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.1,side:THREE.DoubleSide}));
    bowl.position.set(0,h-0.15,0); g.add(bowl);
    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,h*0.7,12),new THREE.MeshStandardMaterial({color:0xE0E0E0}));
    leg.position.set(0,h*0.35,0); g.add(leg);
    addM(g,new THREE.BoxGeometry(0.04,0.18,0.12),new THREE.MeshStandardMaterial({color:0xB0BEC5,metalness:0.9,roughness:0.1}),0,h+0.05,-d*0.3);
  } else if(shape==='plant'){
    var pot=new THREE.Mesh(new THREE.CylinderGeometry(w*0.4,w*0.3,h*0.35,16),new THREE.MeshStandardMaterial({color:0x8D6E63}));
    pot.position.y=h*0.175; pot.castShadow=true; g.add(pot);
    var leafMat=new THREE.MeshStandardMaterial({color:0x2E7D32,roughness:0.8});
    var l1=new THREE.Mesh(new THREE.SphereGeometry(w*0.4,12,12),leafMat); l1.position.y=h*0.55; g.add(l1);
    var l2=new THREE.Mesh(new THREE.SphereGeometry(w*0.32,12,12),leafMat); l2.position.set(0,h*0.75,0); g.add(l2);
  } else if(shape==='trash'){
    var bin=new THREE.Mesh(new THREE.CylinderGeometry(w/2,w*0.4,h,16),mat); bin.position.y=h/2; g.add(bin);
  } else if(shape==='basin_tub'){
    var tub=new THREE.Mesh(new THREE.CylinderGeometry(w*0.5,w*0.38,h,16,1,true),mat); tub.position.y=h/2; g.add(tub);
  } else if(shape==='table'){
    addM(g,new THREE.BoxGeometry(w,0.05,d),mat,0,h-0.025,0);
    var lw=0.04, lh=h-0.05;
    addLegs(g,w,d,lh/2,lw,lw,lh,0x3E2723);
  } else {
    addM(g,new THREE.BoxGeometry(w,h,d),mat,0,h/2,0);
  }

  g.traverse(function(m){if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
}

function addM(g,geo,mat,x,y,z){var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);}
function addLegs(g,w,d,centerY,lw,ld,lh,c){
  var lm=new THREE.MeshStandardMaterial({color:c,roughness:0.7});
  [[w/2-lw,d/2-ld],[-w/2+lw,d/2-ld],[w/2-lw,-d/2+ld],[-w/2+lw,-d/2+ld]].forEach(function(p){
    var l=new THREE.Mesh(new THREE.CylinderGeometry(lw,lw,lh,12),lm);
    l.position.set(p[0],centerY,p[1]); l.castShadow=true; g.add(l);
  });
}

// ===== POINTER CONTROL =====
function onPointerDown(e){
  activePointers.push(e);
  if (activePointers.length === 1) {
    if (e.button === 2) { isRotCam = true; prevM = { x: e.clientX, y: e.clientY }; return; }
    updM(e); rc.setFromCamera(m2d, camera);
    var hits = rc.intersectObjects(furGroup.children, true);

    if (hits.length > 0) {
      var o = hits[0].object;
      while (o.parent && o.parent !== furGroup) o = o.parent;
      selectObj(o); isDrag = true;
      dragPlane.constant = -o.position.y;
      var pt = new THREE.Vector3(); rc.ray.intersectPlane(dragPlane, pt);
      dragOff.copy(o.position).sub(pt);
    } else {
      deselectObj(); isRotCam = true; prevM = { x: e.clientX, y: e.clientY };
    }
  }
}

function onPointerMove(e){
  for (var i = 0; i < activePointers.length; i++) {
    if (activePointers[i].pointerId === e.pointerId) { activePointers[i] = e; break; }
  }

  if (isRotCam && activePointers.length === 1) {
    var dx = (e.clientX - prevM.x) * 0.4, dy = (e.clientY - prevM.y) * 0.4;
    prevM = { x: e.clientX, y: e.clientY };
    var s = new THREE.Spherical().setFromVector3(camera.position);
    s.theta -= dx * Math.PI / 180;
    s.phi = Math.max(0.15, Math.min(Math.PI * 0.42, s.phi + dy * Math.PI / 180));
    camera.position.setFromSpherical(s); camera.lookAt(0, RH / 4, 0);
    return;
  }

  if (isDrag && selObj && activePointers.length === 1) {
    updM(e); rc.setFromCamera(m2d, camera);
    var pt = new THREE.Vector3(); rc.ray.intersectPlane(dragPlane, pt);
    var dd = selObj.userData;
    var mx = RW / 2 - (dd.w * selObj.scale.x) / 2;
    var mz = RL / 2 - (dd.d * selObj.scale.z) / 2;
    selObj.position.x = Math.max(-mx, Math.min(mx, pt.x + dragOff.x));
    selObj.position.z = Math.max(-mz, Math.min(mz, pt.z + dragOff.z));

    adjustStackHeight(selObj);
    updateSpace();
  }
}

function adjustStackHeight(obj) {
  var dd = obj.userData;
  var baseY = 0;
  if (['tv','lamp','plant','trash','tissue','soap','bag','mop'].includes(dd.shape)) {
    furGroup.children.forEach(function(other){
      if(other !== obj){
        var od = other.userData;
        if(['table','wardrobe','shelf','basin','sink','bar','kitchen_zone'].includes(od.shape)){
          if(Math.abs(obj.position.x - other.position.x) < (dd.w + od.w)/2 &&
             Math.abs(obj.position.z - other.position.z) < (dd.d + od.d)/2){
            baseY = od.h;
          }
        }
      }
    });
  }
  obj.position.y = baseY;
}

function onPointerUp(e){
  activePointers = activePointers.filter(function(p){ return p.pointerId !== e.pointerId; });
  if (activePointers.length === 0) { isRotCam = false; isDrag = false; }
}

function updM(e){
  var r=renderer.domElement.getBoundingClientRect();
  m2d.x=((e.clientX-r.left)/r.width)*2-1;
  m2d.y=-((e.clientY-r.top)/r.height)*2+1;
}

function selectObj(o){
  if(selObj)hl(selObj,false); selObj=o; hl(o,true);
  document.getElementById('sel-name').textContent=o.userData.name||'-';
  document.getElementById('selected-label').style.display='block';
  document.getElementById('rot-slider').value=o.userData.rotDeg||0;
  document.getElementById('rot-label').textContent=Math.round(o.userData.rotDeg||0);
  document.getElementById('scale-slider').value=o.userData.scaleFactor||1;
  document.getElementById('scale-label').textContent=(o.userData.scaleFactor||1).toFixed(1);
}

function deselectObj(){if(selObj)hl(selObj,false);selObj=null;document.getElementById('selected-label').style.display='none';}
function hl(o,on){o.traverse(function(m){if(m.isMesh&&m.material&&m.material.emissive)m.material.emissive.setHex(on?0x334466:0);});}

function updateSpace(){
  var ta=RW*RL,ua=0;
  furGroup.children.forEach(function(o){var d=o.userData,s=o.scale.x;ua+=(d.w||0.8)*s*(d.d||0.8)*s;});
  var fp=Math.max(0,Math.round((1-ua/ta)*100));
  document.getElementById('space-percent').textContent=fp+'%';
  document.getElementById('space-bar').style.width=fp+'%';
  document.getElementById('space-detail').textContent='ห้อง '+ta.toFixed(1)+' ม² | ใช้ '+ua.toFixed(1)+' ม² | ว่าง '+(ta-ua).toFixed(1)+' ม²';
}

function setupUI(){
  document.getElementById('btn-build').onclick=buildRoom;
  document.getElementById('btn-ai-analyze').onclick=analyzeWithGemini;

  var modal = document.getElementById('furn-modal');
  document.getElementById('btn-open-modal').onclick=function(){ modal.style.display='flex'; };
  document.getElementById('btn-close-modal').onclick=function(){ modal.style.display='none'; };
  window.onclick=function(e){ if(e.target===modal) modal.style.display='none'; };

  document.getElementById('upload-photo').onchange=function(){
    if(!this.files[0])return;
    var file=this.files[0];
    currentMimeType=file.type||'image/jpeg';
    var reader=new FileReader();
    reader.onload=function(e){
      var img=document.getElementById('room-photo');
      img.src=e.target.result; img.style.display='block';
      document.getElementById('photo-toggle').style.display='block';
      document.getElementById('btn-ai-analyze').style.display='block';
      currentPhotoBase64=e.target.result.split(',')[1];
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('btn-auto').onclick=function(){
    var items=furGroup.children;
    if(items.length===0){alert('กรุณาเพิ่มเฟอร์นิเจอร์ก่อน');return;}

    var backZ = -RL/2 + 0.8;
    var leftX = -RW/2 + 0.8;

    items.forEach(function(o){
      var d = o.userData;
      if(d.cat === 'sleep'){ o.position.set(leftX + d.w/2, 0, backZ + d.d/2); }
      else if(d.cat === 'storage'){ o.position.set(-leftX - d.w/2, 0, backZ + d.d/2); }
      else if(d.cat === 'table'){ o.position.set(0, 0, RL/2 - d.d/2 - 0.5); }
      adjustStackHeight(o);
    });
    updateSpace();
    alert('จัดห้องอัตโนมัติเรียบร้อย!');
  };

  document.getElementById('btn-delete').onclick=function(){if(!selObj)return;furGroup.remove(selObj);deselectObj();updateSpace();};
  document.getElementById('btn-clear').onclick=function(){while(furGroup.children.length)furGroup.remove(furGroup.children[0]);deselectObj();updateSpace();};

  document.getElementById('btn-rot-90').onclick=function(){
    if(!selObj)return;
    var newRot = ((selObj.userData.rotDeg || 0) + 90) % 360;
    selObj.rotation.y = newRot * Math.PI / 180;
    selObj.userData.rotDeg = newRot;
    document.getElementById('rot-slider').value = newRot;
    document.getElementById('rot-label').textContent = Math.round(newRot);
  };

  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');buildGrid(t.dataset.cat);};
  });
  document.querySelectorAll('.view-btn').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.view-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');
      var v=b.dataset.view;
      if(v==='sims'){camera.position.set(9,9,9);camera.lookAt(0,0,0);}
      else if(v==='top'){camera.position.set(0,15,0.001);camera.lookAt(0,0,0);}
      else if(v==='front'){camera.position.set(0,RH/2,12);camera.lookAt(0,RH/2,0);}
      else{camera.position.set(10,5,10);camera.lookAt(0,1,0);}
    };
  });
  document.getElementById('rot-slider').oninput=function(){
    document.getElementById('rot-label').textContent=Math.round(this.value);
    if(selObj){selObj.rotation.y=parseFloat(this.value)*Math.PI/180;selObj.userData.rotDeg=parseFloat(this.value);}
  };
  document.getElementById('scale-slider').oninput=function(){
    var v=parseFloat(this.value);
    document.getElementById('scale-label').textContent=v.toFixed(1);
    if(selObj){selObj.scale.setScalar(v);selObj.userData.scaleFactor=v;updateSpace();}
  };
}

function buildGrid(cat){
  var grid=document.getElementById('furniture-grid');grid.innerHTML='';
  var list=(!cat||cat==='all')?FLIST:FLIST.filter(function(f){return f.cat===cat;});
  list.forEach(function(f){
    var c=document.createElement('div');c.className='furn-card';
    c.innerHTML='<div class="furn-icon">'+f.icon+'</div><div class="furn-name">'+f.name+'</div>';
    c.onclick=function(){
      addFurniture(f);
      document.getElementById('furn-modal').style.display='none';
    }; 
    grid.appendChild(c);
  });
}

function buildColors(){
  var w=document.getElementById('color-picker');
  COLORS.forEach(function(h){
    var d=document.createElement('div');d.className='color-dot';
    d.style.background='#'+h.toString(16).padStart(6,'0');
    d.onclick=function(){
      if(selObj)selObj.traverse(function(m){if(m.isMesh&&!m.material.transparent)m.material=new THREE.MeshStandardMaterial({color:h,roughness:0.65});});
    };
    w.appendChild(d);
  });
}

function buildTextures(){
  var w=document.getElementById('texture-picker');
  TEXTURES.forEach(function(t){
    var b=document.createElement('div');b.className='tex-btn';b.textContent=t.name;
    b.onclick=function(){
      if(selObj)selObj.traverse(function(m){if(m.isMesh){m.material.roughness=t.r;m.material.metalness=t.m;m.material.needsUpdate=true;}});
    };
    w.appendChild(b);
  });
}

init();
buildRoom();
</script>
